<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crafty Dee's Table Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top"><div class="brand"><img id="brandlogo" alt="" hidden><h1 id="brandname">Crafty Dee's</h1></div><span class="sub" id="sub"></span></header>

<div class="cart" id="cart" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="recaptcha"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script type="module" src="app.js"></script>

</html>
