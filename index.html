<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Crafty Dee's Table Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; a tab strip switches between the diner's phone and each station's screen. */
:root{
  --bg:#f6f4ee; --surface:#ffffff; --fg:#22261f; --muted:#666b5e; --line:#dfdcd1;
  --accent:#b9741a; --accent-ink:#ffffff; --accent-soft:#f6e7cf;
  --hop:#3f5a2c; --hop-soft:#e3ead9;
  --good:#2f7a45; --warn:#a8650f; --crit:#b23a2e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161812; --surface:#20231b; --fg:#ecebe3; --muted:#a2a596; --line:#34382c;
  --accent:#e0a14a; --accent-ink:#1b1408; --accent-soft:#3a2c16;
  --hop:#a9c38c; --hop-soft:#2a3421;
  --good:#6cc487; --warn:#e5a24d; --crit:#ec7a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161812; --surface:#20231b; --fg:#ecebe3; --muted:#a2a596; --line:#34382c;
  --accent:#e0a14a; --accent-ink:#1b1408; --accent-soft:#3a2c16;
  --hop:#a9c38c; --hop-soft:#2a3421;
  --good:#6cc487; --warn:#e5a24d; --crit:#ec7a6c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
section{padding-top:16px}
.label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);margin:22px 0 8px}
.tablebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--hop-soft);border-radius:12px;padding:12px 14px}
.tablebar b{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.code{font-family:var(--display);font-size:22px;letter-spacing:.18em;color:var(--hop)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.people{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.addp{display:flex;gap:6px}
.addp input{width:120px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:6px;scrollbar-width:thin}
.cats .chip{white-space:nowrap}
.item{display:grid;gap:6px;padding:14px 0;border-bottom:1px solid var(--line)}
.item h3{margin:0;font-size:16px;font-weight:600}
.item .d{margin:0;color:var(--muted);font-size:13px}
.item .meta{font-size:12px;color:var(--hop);font-weight:600}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.var{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.var span{color:var(--muted);font-size:12px}
.var:hover{border-color:var(--accent)}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgb(0 0 0 / .08)}
.cart .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.cline{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cline button{border:none;background:none;color:var(--crit);font-size:12px;padding:0 4px}
.cart input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.cartbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:none;border-radius:10px;padding:12px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.s-new{background:var(--accent-soft);color:var(--warn)}
.s-preparing{background:var(--hop-soft);color:var(--hop)}
.s-ready{background:var(--good);color:#fff}
.s-served{background:transparent;color:var(--muted);border:1px solid var(--line)}
.oline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;align-items:baseline}
.oline .l{min-width:0}
.who{font-weight:600;margin-top:12px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--accent)}
.ticket.preparing{border-left-color:var(--hop)}
.ticket.ready{border-left-color:var(--good);opacity:.85}
.ticket header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ticket header b{font-family:var(--display);font-size:20px;text-transform:uppercase}
.ticket ul{margin:8px 0;padding:0;list-style:none;display:grid;gap:4px}
.ticket li{font-size:15px}
.ticket li .q{font-weight:700;margin-right:6px}
.ticket .nt{font-size:13px;color:var(--warn);font-style:italic}
.ticket.alert{border-left-color:var(--crit)}
.waitbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.waitbar b{font-size:16px}
.btn:disabled{opacity:.6;cursor:default}
.ontheway{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--good);color:#fff;font-weight:600}
.ontheway .note{color:#fff;opacity:.85;margin:0}
@media (prefers-reduced-motion:no-preference){.ontheway{animation:pop .4s ease-out}@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}}}
.ticket .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 14px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.billrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.billrow .amt{font-family:var(--display);font-size:22px}
.paid{text-decoration:line-through;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:600;padding-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9}
@media (prefers-reduced-motion:no-preference){.ticket{animation:in .25s ease-out}@keyframes in{from{transform:translateY(-4px)}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Crafty Dee's</h1><small>Prototype · sample table</small></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div class="cart" id="cart" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const T=(l,p)=>[l,p], BEER=(a,b,c,d)=>[T('Taste',a),T('Half 250ml',b),T('Full 400ml',c)].concat(d?[T('Tower',d)]:[]);
const MENU=[
 {c:'On tap',st:'bar',items:[
  {n:'Light Lager',m:'ABV 3.2%',v:BEER(2000,6000,9000,70000)},
  {n:'Pilsner',m:'ABV 4.6% · Silver, African Beer Cup',v:BEER(2000,7000,10000,80000)},
  {n:'Blonde Ale',m:'ABV 4.5%',v:BEER(2000,7000,10000,80000)},
  {n:'Pale Ale',m:'ABV 4.5%',v:BEER(3000,8000,11000,85000)},
  {n:'IPA',m:'ABV 6%',v:BEER(4000,10000,13000,100000)},
  {n:'Wheat Beer',m:'ABV 4.5% · Gold, African Beer Cup',v:BEER(3000,8000,11000,85000)},
  {n:'Double IPA',m:'ABV 8%',v:BEER(5000,12000,16000)},
  {n:'Apple Cider',m:'ABV 4%',v:BEER(3000,8000,11000)},
  {n:'SMaSH Lager',m:'ABV 4.5% · New',v:BEER(3000,8000,11000,85000)},
  {n:'Festbier',m:'ABV 4.6% · New',v:BEER(3000,7000,10000,80000)}]},
 {c:'Cocktails',st:'bar',items:[
  {n:'Passion Gin Fizz',d:'Double gin, passion juice, sugar, lemon, soda',v:[T('',15000)]},
  {n:'Caipirinha',d:'Double white rum, lemon, sugar',v:[T('',15000)]},
  {n:'Mai Tai',d:'Dark and white rum, pineapple, sugar, lemon',v:[T('',15000)]},
  {n:'Whiskey Sour',d:'Double Jameson, egg white, lemon, sugar',v:[T('',15000)]},
  {n:'Mojito',d:'Double rum, lime, mint, soda',v:[T('Classic',20000),T('Strawberry',20000),T('Passion',20000)]},
  {n:'Lagerita',d:'Triple sec, double tequila, lemon, Light Lager',v:[T('',15000)]},
  {n:'Blue Lagoon',d:'Double vodka, blue curaçao',v:[T('',15000)]},
  {n:"Dee's Tin",d:'Blue curaçao, Malibu, pineapple, sugar, lemon',v:[T('',18000)]},
  {n:'Gin / Vodka Martini',v:[T('Gin',15000),T('Vodka',15000)]},
  {n:'Vodka Amarula Martini',d:'Vodka, Kahlúa, Amarula',v:[T('',20000)]}]},
 {c:'Pub grub',st:'kitchen',items:[
  {n:'Fish & Chips',v:[T('',21000)]},
  {n:'Chicken Tenders',d:'With chips',v:[T('',18000)]},
  {n:'Quesadilla',v:[T('Chicken',18000),T('Pork',18000),T('Mutton',18000),T('Veg',16000)]},
  {n:'Calamari Rings',v:[T('Grilled',16000),T('Fried',16000)]},
  {n:'Buffalo Wings',v:[T('',15000)]},
  {n:'TZ Cassava Tots',m:'Vegetarian',v:[T('',12000)]},
  {n:'Buffalo Cauliflower',m:'Vegetarian',v:[T('',10000)]},
  {n:'Beer Battered Zucchini Fritters',m:'Vegetarian',v:[T('',9000)]}]},
 {c:'Burgers & pizza',st:'kitchen',items:[
  {n:'Minced Lamb Burger',v:[T('',20000)]},
  {n:'Minced Chicken Burger',v:[T('',18000)]},
  {n:'Pizza Margarita',m:'Vegetarian',v:[T('',15000)]},
  {n:'Pizza Vegetarian',m:'Vegetarian',v:[T('',18000)]},
  {n:'Pizza Chicken',v:[T('Chicken',20000),T('Buffalo chicken',20000)]},
  {n:'Pizza Smoked Pork Belly',v:[T('',20000)]}]},
 {c:'Sandwiches & bowls',st:'kitchen',items:[
  {n:'Pork Belly Panini',d:'Smoked pork belly, cheese, pickles, mustard',v:[T('',18000)]},
  {n:'Mushroom & Spinach Panini',d:'Mushroom, peppers, spinach, goat cheese',v:[T('',18000)]},
  {n:'Spicy Chicken Panini',d:'Grilled chicken, avocado, chipotle',v:[T('',18000)]},
  {n:'Sesame Seared Tuna Bowl',d:'Tuna, avocado, rice, ponzu',v:[T('',18000)]},
  {n:'Bread Crusted Chicken Bowl',v:[T('Brown rice',18000),T('White rice',18000)]},
  {n:'Vegan Bowl',d:'Chickpeas, veg, avocado, tahini',v:[T('Brown rice',15000),T('White rice',15000)]}]},
 {c:'Salads & sharing',st:'kitchen',items:[
  {n:'Greek Salad',v:[T('',18000)]},
  {n:'Chicken Caesar',v:[T('',18000)]},
  {n:'Mango Salad',v:[T('',12000)]},
  {n:'Meat Platter',d:'Wings, sheekh kebab, tenders, pork quesadillas, chips',v:[T('',60000)]},
  {n:'Seafood Platter',d:'Calamari, fish skewers, fish fingers, prawns, chips',v:[T('',50000)]},
  {n:'Veg Platter',v:[T('',40000)]}]},
 {c:'Sides & sweet',st:'kitchen',items:[
  {n:'Chips',v:[T('',3000)]},{n:'Coleslaw',v:[T('',3000)]},{n:'Garlic Bread',v:[T('',5000)]},
  {n:'Ice Cream',v:[T('',10000)]},
  {n:'Apple Crumble',d:'With vanilla ice cream · about 30 min',v:[T('',15000)]}]},
 {c:'Fired Up Grill',st:'grill',items:[
  {n:'Beef Nundu',v:[T('',12000)]},{n:'Beef Wrap',v:[T('',15000)]},{n:'Cheesy Chips',v:[T('',12000)]},
  {n:'Half Tandoori Chicken',d:'With chips',v:[T('',18000)]},
  {n:'Pepper Steak',v:[T('Chips',30000),T('Mash',30000)]},
  {n:'Grilled Sirloin',v:[T('Chips',45000),T('Mash',45000)]}]}
];
const STATIONS={kitchen:'Kitchen',bar:'Bar',grill:'Fired Up Grill'};
const NEXT={new:['preparing','Start'],preparing:['ready','Ready']};
const ALERT={call:'Call waiter',bill:'Bill please'};
const fmt=n=>n.toLocaleString('en-US');

function seed(){return{tab:'diner',cat:0,table:4,code:'4821',people:[{id:'p1',name:'Amani'},{id:'p2',name:'Neha'}],active:'p1',cart:[],note:'',split:'order',paid:{},
 waiters:[{id:'w1',name:'Grace'},{id:'w2',name:'Baraka'},{id:'w3',name:'Juma'}],me:'w1',waiter:null,alerts:[],
 lines:[
  {id:'l1',b:'b1',p:'p1',n:'Pilsner',v:'Full 400ml',pr:10000,st:'bar',s:'served',t:Date.now()-900000},
  {id:'l2',b:'b1',p:'p1',n:'Buffalo Wings',v:'',pr:15000,st:'kitchen',s:'preparing',t:Date.now()-900000},
  {id:'l3',b:'b2',p:'p2',n:'Mojito',v:'Passion',pr:20000,st:'bar',s:'new',t:Date.now()-120000},
  {id:'l4',b:'b2',p:'p2',n:'Half Tandoori Chicken',v:'',pr:18000,st:'grill',s:'new',t:Date.now()-120000,note:'Extra spicy'}]}}
let S; try{S=JSON.parse(localStorage.getItem('dees-proto'))}catch(e){} if(!S||!S.waiters) S=seed();
const wname=id=>(S.waiters.find(w=>w.id===id)||{}).name;
const openAlerts=()=>S.alerts.filter(a=>!a.done);
const save=()=>{try{localStorage.setItem('dees-proto',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname=id=>(S.people.find(p=>p.id===id)||{}).name||'Guest';
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m+' min ago'};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}

function render(){
  const open=st=>S.lines.filter(l=>l.st===st&&l.s!=='served'&&l.s!=='ready').length;
  const forMe=(!S.waiter?1:S.waiter===S.me?openAlerts().length+S.lines.filter(l=>l.s==='ready').length:0);
  const tabs=[['diner','Diner phone'],['waiter','Waiter',forMe],['kitchen','Kitchen',open('kitchen')],['bar','Bar',open('bar')],['grill','Grill',open('grill')],['bill','Bill']];
  $('#tabs').innerHTML=tabs.map(([k,l,b])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
  const v=$('#view');
  if(S.tab==='diner') v.innerHTML=diner();
  else if(S.tab==='bill') v.innerHTML=bill();
  else if(S.tab==='waiter') v.innerHTML=waiterView();
  else v.innerHTML=station(S.tab);
  renderCart(); save();
}

function onWay(){
  return openAlerts().filter(a=>a.ack).map(a=>`<div class="ontheway" role="status"><span>${esc(wname(a.w)||'Your waiter')} ${a.type==='bill'?'is bringing your bill':'is on the way to your table'}</span><span class="note">${ago(a.ack)}</span></div>`).join('');
}
function diner(){
  const cat=MENU[S.cat];
  const mine=S.people.map(p=>{const ls=S.lines.filter(l=>l.p===p.id);if(!ls.length)return'';
    return `<div class="who">${esc(p.name)}${p.id===S.active?' (you)':''}</div>`+ls.map(l=>`<div class="oline"><span class="l">${esc(l.n)}${l.v?` · ${esc(l.v)}`:''}</span><span><span class="pill s-${l.s}">${l.s}</span></span></div>`).join('')}).join('');
  return `<section>
  <div class="tablebar"><div><b>Table ${S.table}</b><div class="note" style="margin:2px 0 0">Friends join with code</div></div>
   <div style="display:flex;gap:10px;align-items:center"><span class="code num">${S.code}</span><button class="btn" data-act="share">Copy invite</button></div></div>
  ${onWay()}
  <div class="waitbar">
   <div><div class="note" style="margin:0">Your waiter</div><b>${S.waiter?esc(wname(S.waiter)):'Being assigned…'}</b></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap">${Object.entries(ALERT).map(([k,l])=>{const a=openAlerts().find(x=>x.type===k),on=!!a;
     return `<button class="btn${on?'':' primary'}" data-alert="${k}" ${on?'disabled':''}>${a?(a.ack?'On the way':(k==='call'?'Waiter called':'Bill requested')):l}</button>`}).join('')}</div>
  </div>
  <div class="people" aria-label="Who is ordering">
   ${S.people.map(p=>`<button class="chip" aria-pressed="${p.id===S.active}" data-person="${p.id}">${esc(p.name)}</button>`).join('')}
   <form class="addp" id="addp"><input id="newname" placeholder="Friend's name" aria-label="Friend's name" maxlength="16"><button class="btn">Join</button></form>
  </div>
  <p class="note">Each chip stands in for a different person's phone. Tap a name to order as them.</p>
  <div class="label">Menu</div>
  <div class="cats">${MENU.map((m,i)=>`<button class="chip" aria-pressed="${i===S.cat}" data-cat="${i}">${m.c}</button>`).join('')}</div>
  ${cat.items.map((it,ii)=>`<div class="item"><h3>${esc(it.n)}</h3>${it.d?`<p class="d">${esc(it.d)}</p>`:''}${it.m?`<div class="meta">${esc(it.m)}</div>`:''}
   <div class="vars">${it.v.map(([l,p],vi)=>`<button class="var" data-add="${S.cat}.${ii}.${vi}">${l?`${esc(l)} `:'Add '}<span class="num">TSh ${fmt(p)}</span></button>`).join('')}</div></div>`).join('')}
  <div class="label">Table order</div>
  ${mine||'<p class="note">No orders yet.</p>'}
  <p class="note">Menu copied from photos on Google; prices may be out of date.</p>
  </section>`;
}

function renderCart(){
  const c=$('#cart'); if(S.tab!=='diner'||!S.cart.length){c.hidden=true;return}
  const tot=S.cart.reduce((a,l)=>a+l.pr,0);
  c.hidden=false;
  c.innerHTML=`<div class="in">${S.cart.map((l,i)=>`<div class="cline"><span>${esc(l.n)}${l.v?` · ${esc(l.v)}`:''}</span><span class="num">${fmt(l.pr)} <button data-rm="${i}" aria-label="Remove ${esc(l.n)}">Remove</button></span></div>`).join('')}
   <input id="note" placeholder="Note for the kitchen (e.g. no onions)" value="${esc(S.note)}">
   <button class="cartbtn" data-act="place"><span>Place order as ${esc(pname(S.active))}</span><span class="num">TSh ${fmt(tot)}</span></button></div>`;
}

function station(st){
  const ls=S.lines.filter(l=>l.st===st&&l.s!=='served');
  const batches=[...new Set(ls.map(l=>l.b))];
  if(!batches.length) return `<section><p class="empty">No open orders for the ${STATIONS[st]}.</p></section>`;
  return `<section><div class="label">${STATIONS[st]} · open tickets</div>`+batches.map(b=>{
    const bl=ls.filter(l=>l.b===b), s=bl[0].s, nx=NEXT[s], note=bl.find(l=>l.note);
    return `<article class="ticket ${s}"><header><b>Table ${S.table}</b><span class="note" style="margin:0">${esc(pname(bl[0].p))} · ${ago(bl[0].t)}</span></header>
     <div class="note" style="margin:2px 0 0">Waiter: ${S.waiter?esc(wname(S.waiter)):'not assigned yet'}</div>
     <ul>${bl.map(l=>`<li><span class="q">1×</span>${esc(l.n)}${l.v?` · ${esc(l.v)}`:''}</li>`).join('')}</ul>
     ${note?`<div class="nt">${esc(note.note)}</div>`:''}
     <div class="acts" style="margin-top:8px"><span class="pill s-${s}">${s}</span>${nx?`<button class="btn primary" data-adv="${b}" data-st="${st}">${nx[1]}</button>`:''}</div></article>`}).join('')+`</section>`;
}

function waiterView(){
  const me=S.me, mine=S.waiter===me, ready=S.lines.filter(l=>l.s==='ready');
  const total=S.lines.reduce((a,l)=>a+l.pr,0);
  let body;
  if(!S.waiter) body=`<article class="ticket"><header><b>Table ${S.table}</b><span class="pill s-new">No waiter</span></header>
    <p class="note">${S.people.length} guests · ${S.lines.length} items ordered · TSh ${fmt(total)}</p>
    <div class="acts" style="margin-top:8px"><button class="btn primary" data-act="accept">Accept table as ${esc(wname(me))}</button></div></article>`;
  else if(!mine) body=`<p class="empty">Table ${S.table} is with ${esc(wname(S.waiter))}.<br>Its alerts go to them.</p>`;
  else body=`<div class="label">Alerts</div>${openAlerts().length?openAlerts().map(a=>`<article class="ticket alert"><header><b>${ALERT[a.type]}</b><span class="note" style="margin:0">${ago(a.t)}</span></header>
     <p class="note" style="margin:4px 0 8px">Table ${S.table} · from ${esc(pname(a.p))}</p>
     <div class="acts">${a.ack?`<span class="pill s-preparing">Diner notified</span><button class="btn primary" data-done="${a.id}">${a.type==='bill'?'Bill delivered':'Done'}</button>`:`<button class="btn primary" data-ack="${a.id}">On my way</button>`}${a.type==='bill'?`<button class="btn" data-tab="bill">Open split</button>`:''}</div></article>`).join(''):'<p class="note">No alerts right now.</p>'}
    <div class="label">Ready to serve</div>${ready.length?ready.map(l=>`<div class="oline"><span class="l">${esc(l.n)}${l.v?` · ${esc(l.v)}`:''} <span class="note">for ${esc(pname(l.p))} · ${STATIONS[l.st]}</span></span><button class="btn" data-serve="${l.id}">Served</button></div>`).join(''):'<p class="note">Nothing waiting at the pass.</p>'}
    <div class="label">My tables</div>
    <div class="oline"><span class="l"><b>Table ${S.table}</b> · ${S.people.map(p=>esc(p.name)).join(', ')}</span><span class="num">TSh ${fmt(total)}</span></div>
    <div style="margin-top:16px"><button class="btn ghost" data-act="release">Hand table to another waiter</button></div>`;
  return `<section><div class="label" style="margin-top:0">I am</div>
   <div class="people" style="margin-top:0">${S.waiters.map(w=>`<button class="chip" aria-pressed="${w.id===me}" data-me="${w.id}">${esc(w.name)}</button>`).join('')}</div>
   <p class="note">On a real phone the waiter logs in once; these chips let you switch between staff here.</p>${body}</section>`;
}

function bill(){
  const total=S.lines.reduce((a,l)=>a+l.pr,0), n=S.people.length;
  const share=p=>S.split==='equal'?Math.ceil(total/n/100)*100:S.lines.filter(l=>l.p===p.id).reduce((a,l)=>a+l.pr,0);
  return `<section><div class="label">Split the bill · Table ${S.table}</div>
   <div class="seg" role="group" aria-label="Split method"><button aria-pressed="${S.split==='order'}" data-split="order">By what they ordered</button><button aria-pressed="${S.split==='equal'}" data-split="equal">Equally</button></div>
   ${S.people.map(p=>{const pd=S.paid[p.id];return `<div class="billrow"><div><div class="${pd?'paid':''}" style="font-weight:600">${esc(p.name)}</div>
     ${S.split==='order'?`<div class="note" style="margin:0">${S.lines.filter(l=>l.p===p.id).map(l=>esc(l.n)).join(', ')||'Nothing ordered'}</div>`:''}</div>
     <div style="display:flex;align-items:center;gap:10px"><span class="amt num ${pd?'paid':''}">${fmt(share(p))}</span><button class="btn ${pd?'':'primary'}" data-paid="${p.id}">${pd?'Undo':'Mark paid'}</button></div></div>`}).join('')}
   <div class="total"><span>Table total</span><span class="num">TSh ${fmt(total)}</span></div>
   ${S.split==='equal'?`<p class="note">Equal shares round up to the nearest 100 shillings.</p>`:''}
   <p class="note">Payment happens at the table as usual for now; in-app mobile money comes in Phase 4.</p>
   <div style="margin-top:24px"><button class="btn ghost" data-act="reset">Reset sample table</button></div></section>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;
  if(d.tab){S.tab=d.tab;window.scrollTo(0,0)}
  else if(d.cat){S.cat=+d.cat}
  else if(d.person){S.active=d.person}
  else if(d.add){const[c,i,v]=d.add.split('.').map(Number),it=MENU[c].items[i],[l,p]=it.v[v];S.cart.push({n:it.n,v:l,pr:p,st:MENU[c].st});toast(`Added ${it.n}`)}
  else if(d.rm){S.cart.splice(+d.rm,1)}
  else if(d.adv){S.lines.forEach(l=>{if(l.b===d.adv&&l.st===d.st)l.s=NEXT[l.s][0]})}
  else if(d.alert){S.alerts.push({id:'a'+Date.now(),type:d.alert,p:S.active,t:Date.now()});
    toast(S.waiter?`${wname(S.waiter)} has been notified`:'All waiters notified')}
  else if(d.me){S.me=d.me}
  else if(d.act==='accept'){S.waiter=S.me;toast(`${wname(S.me)} now looks after table ${S.table}`)}
  else if(d.act==='release'){S.waiter=null;toast(`Table ${S.table} is open for another waiter`)}
  else if(d.ack){const a=S.alerts.find(x=>x.id===d.ack);if(a){a.ack=Date.now();a.w=S.me;toast(`${pname(a.p)} has been told you're on the way`)}}
  else if(d.done){const a=S.alerts.find(x=>x.id===d.done);if(a)a.done=true}
  else if(d.serve){const l=S.lines.find(x=>x.id===d.serve);if(l)l.s='served'}
  else if(d.split){S.split=d.split}
  else if(d.paid){S.paid[d.paid]=!S.paid[d.paid]}
  else if(d.act==='place'){const bid='b'+Date.now(),note=($('#note')||{}).value||'';
    S.cart.forEach((l,i)=>S.lines.push({id:bid+i,b:bid,p:S.active,n:l.n,v:l.v,pr:l.pr,st:l.st,s:'new',t:Date.now(),note:note||undefined}));
    const sts=[...new Set(S.cart.map(l=>STATIONS[l.st]))];S.cart=[];S.note='';toast('Sent to '+sts.join(' and '))}
  else if(d.act==='share'){const txt=`Join my table at Crafty Dee's: code ${S.code}`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Invite copied'),()=>toast('Code: '+S.code))}
  else if(d.act==='reset'){S=seed();toast('Sample table reset')}
  else return;
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='note')S.note=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='addp')return;e.preventDefault();const n=$('#newname').value.trim();if(!n)return;
  const id='p'+Date.now();S.people.push({id,name:n});S.active=id;delete S.paid[id];toast(n+' joined table '+S.table);render()});
render();
</script>

</body>
