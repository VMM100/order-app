<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order App Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dark stage with four phone frames in a row; each frame holds the live app at phone size, scaled to fit. */
:root{
  --stage:#14160f; --panel:#1f2219; --ink:#ecebe3; --muted:#a2a596; --line:#34382c;
  --accent:#e0a14a; --accent-ink:#1b1408; --bezel:#050604;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.6;cursor:default}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);counter-reset:s}
.steps span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.steps span::before{counter-increment:s;content:counter(s) "  ";color:var(--accent);font-weight:700}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;align-items:start}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;min-height:0;height:100%}
.slotbar{display:flex;gap:6px;align-items:center;max-width:100%}
.slotbar .reload{padding:5px 10px;font-size:16px;line-height:1}
.slot select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;max-width:100%}
.frameBox{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.phone{position:relative;background:var(--bezel);border-radius:34px;padding:10px;box-shadow:0 0 0 1px #2a2d24,0 20px 40px rgb(0 0 0 / .45);transform-origin:top center}
.phone::before{content:"";position:absolute;top:16px;left:50%;width:74px;height:18px;margin-left:-37px;background:var(--bezel);border-radius:10px;z-index:2}
.phone iframe{display:block;width:390px;height:780px;border:0;border-radius:26px;background:#f6f4ee}
.qrbox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px}
.qrbox .q{background:#fff;border-radius:6px;padding:4px;line-height:0}
.qrbox .q img,.qrbox .q canvas{width:64px!important;height:64px!important}
.qrbox small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--stage);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9}
[hidden]{display:none!important}
@media (max-width:700px){.stage{grid-template-columns:repeat(2,minmax(0,1fr))}.slot{height:auto}.frameBox{height:auto}}
</style>
</head>
<body>
<div class="bar">
  <h1 id="title">Table ordering · live demo</h1>
  <div class="grow"></div>
  <div class="qrbox" title="Scan to join the demo table from a real phone">
    <div class="q" id="qr"></div>
    <div><b>Join from your phone</b><small>Scan to sit at table <span id="tno"></span></small></div>
  </div>
  <select id="phones" class="btn" aria-label="Number of phones"><option value="3">3 phones</option><option value="4" selected>4 phones</option></select>
  <button class="btn" id="reset">Reset demo table</button>
</div>
<div class="steps" aria-label="Demo script">
  <span>Both diners join table</span><span>Order a beer and wings</span><span>Bar &amp; kitchen get their part</span>
  <span>Waiter accepts, serves</span><span>"Bill please" → On my way</span><span>Split the bill</span><span>Show the dashboard</span>
</div>
<main class="stage" id="stage"></main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="demo.js"></script>
</body>
</html>
