# Cloudflare Worker: the Wasabi ring service (see ring.js). Published by .github/workflows/publish.yml.
name = "wasabi-ring"
main = "ring.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

# At most 60 ring requests a minute from one address (see ring.js). Free on every Cloudflare plan.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# The same event asked about more than 10 times a minute (from anywhere): ignored. The app asks once,
# the service rings once; repeats only cost database reads.
[[ratelimits]]
name = "LIMIT_EVENT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# One restaurant (or demo room): at most 300 ring requests a minute from all addresses together, so many
# addresses can't flood one restaurant. A full 30-table night sends a few dozen.
[[ratelimits]]
name = "LIMIT_PLACE"
namespace_id = "1003"
simple = { limit = 300, period = 60 }
