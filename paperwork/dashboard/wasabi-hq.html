<style>

}

  --green:#a9d14a; --green-deep:#c4e27a; --green-soft:#2c3a1c; --late:#ff8a66; --late-soft:#45241a; --violet-soft:#33284a; --violet:#d6c6f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a12; --surface:#1d2519; --sunk:#252e20; --line:#36412f; --ink:#eef2e4; --text:#e2e7d8; --muted:#a3ab96;
  --green:#a9d14a; --green-deep:#c4e27a; --green-soft:#2c3a1c; --late:#ff8a66; --late-soft:#45241a; --violet-soft:#33284a; --violet:#d6c6f2; color-scheme:dark}

.num{font-variant-numeric:tabular-nums}

.nav a:hover{background:var(--sunk)}

main{padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}

.search{display:flex;gap:8px;padding:0 18px 12px}

a.out{color:var(--green-deep);font-weight:600;text-decoration:none}

.rcard{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;margin-bottom:8px}

.rcard .n{font:700 16px/1.2 var(--display);color:var(--ink)}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.small{font-size:13px;color:var(--muted)}
table.money{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto}
table.money th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
table.money td{padding:9px 18px;border-bottom:1px solid var(--line);vertical-align:top}
table.money td.r,table.money th.r{text-align:right}

</style>

<script>
(function () {
"use strict";
// ======================================================================= basics
const O = window.ONBOARDING;

const days = (a, b) => Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);
const fmt = (d) => { if (!d) return ""; const [y, m, x] = d.split("-"); return `${+x} ${MON[+m - 1]}${y !== today().slice(0, 4) ? " " + y : ""}`; };
const tsh = (n) => "TSh " + Math.round(Number(n) || 0).toLocaleString("en-US");
const icon = (path) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "ico"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round"); s.setAttribute("aria-hidden", "true"); s.innerHTML = path; return s; };
const I = { folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>', file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', check: '<path d="m5 12 5 5 9-10"/>', store: '<path d="M4 10v10h16V10M3 6l2-3h14l2 3v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/>', coin: '<circle cx="12" cy="12" r="9"/><path d="M15 9h-4a2 2 0 0 0 0 4h2a2 2 0 0 1 0 4H9M12 6v2M12 16v2"/>' };

let db = null, mcp = null;
const S = { todos: [], restaurants: [], money: [], deadlines: [], rules: [], settings: {}, loaded: new Set() };
const route = () => { const h = decodeURIComponent(location.hash.slice(1)); const [view, ...rest] = h.split("--"); return { view: view || "home", arg: rest.join("--") }; };
let ui = { rest: null, rfilter: "all", folder: null, edit: null, todoOpen: new Set(), moneyForm: null, dlForm: null, todoForm: false };
try { ui.todoOpen = new Set(JSON.parse(localStorage.getItem("hq-todo-open") || "[]")); } catch {}

async function save(col, id, patch, statusEl) {
  try { await db.collection(col).doc(id).update(patch); if (statusEl) statusEl.textContent = "Saved"; return true; }
  catch (e) { if (statusEl) statusEl.textContent = e && e.code === "invalid_argument" ? "You can view this but not change it." : "Couldn't save. Check your connection and try again."; return false; }
}
async function create(col, id, data, statusEl) {
  try { const ref = id ? db.collection(col).doc(id) : db.collection(col).doc(); await ref.set(data); return ref.id; }
  catch (e) { if (statusEl) statusEl.textContent = e && e.code === "quota_exceeded" ? "The store is full." : "Couldn't save. Check your connection and try again."; return null; }
}

// ======================================================================= Google Drive
const DRIVE = "Google Drive", FOLDER = "application/vnd.google-apps.folder";
const driveMsg = (e) => {
  const c = e && e.code;
  if (c === "needs_reauth") return "Google Drive needs reconnecting: claude.ai → Settings → Connectors → Google Drive.";
  if (c === "server_not_connected" || c === "selection_required") return "Add Google Drive in claude.ai → Settings → Connectors to see your files here.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "This page isn't allowed to use Google Drive yet. Tap Try again and choose Allow.";
  if (c === "blocked_by_policy") return "Your organisation's settings block Google Drive here.";
  if (c === "server_unavailable" || c === "rate_limited") return "Google Drive didn't answer. Try again in a moment.";
  if (c === "tool_error") return "Google Drive refused that: " + String(e.message || "").slice(0, 160);
  if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Files can't be reached in this view. Open Wasabi HQ on claude.ai, signed in.";
  return "Something went wrong with Google Drive. Try again.";

async function drive(tool, input, read) {
  if (!mcp) throw { code: "capability_disabled" };
  const r = await mcp.callTool(DRIVE, tool, input, read ? { cache: { staleTime: 60000, gcTime: 600000 } } : { cache: false });

const q = (s) => String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");

  let out = [], token;
  for (let i = 0; i < 6; i++) {
    const p = await drive("search_files", { query: `parentId = '${q(parentId)}' and trashed = false${onlyFolders ? ` and mimeType = '${FOLDER}'` : ""}`, pageSize: 100, excludeContentSnippets: true, ...(token ? { pageToken: token } : {}) }, true);
    out = out.concat((p && p.files) || []); token = p && p.nextPageToken; if (!token) break;
  }

// All folders under the Wasabi folder, worked out once per visit (for paths, the folder picker and search).
const tree = { map: new Map(), ready: null };
function loadTree(force) {
  if (tree.ready && !force) return tree.ready;
  const root = S.settings.rootId;
  tree.ready = (async () => {
    tree.map = new Map([[root, { id: root, title: "Wasabi", parentId: null }]]);
    let level = [root];
    for (let depth = 0; depth < 5 && level.length; depth++) {
      const next = [];
      for (let i = 0; i < level.length; i += 12) {
        const ids = level.slice(i, i + 12);
        const p = await drive("search_files", { query: `mimeType = '${FOLDER}' and trashed = false and (${ids.map((x) => `parentId = '${q(x)}'`).join(" or ")})`, pageSize: 100, excludeContentSnippets: true }, true);
        for (const f of (p && p.files) || []) if (!tree.map.has(f.id)) { tree.map.set(f.id, { id: f.id, title: f.title, parentId: f.parentId }); next.push(f.id); }
      }
      level = next;
    }
    return tree.map;
  })();
  tree.ready.catch(() => { tree.ready = null; });
  return tree.ready;
}
const pathOf = (id) => { const parts = []; let cur = tree.map.get(id); let n = 0; while (cur && n++ < 10) { parts.unshift(cur.title); cur = tree.map.get(cur.parentId); } return parts.join(" / "); };
const folderOptions = () => [...tree.map.values()].filter((f) => f.parentId).map((f) => ({ id: f.id, path: pathOf(f.id).replace(/^Wasabi \/ /, "") })).filter((f) => !/^_to_delete/.test(f.path)).sort((a, b) => a.path.localeCompare(b.path));

// House-style file names: "2026-11-20 Counterparty - What.pdf"
function suggest(file) {
  const t = file.title || "", ext = (t.match(/\.[A-Za-z0-9]{2,5}$/) || [""])[0], base = t.slice(0, t.length - ext.length);
  // A date in the name counts only if it's a real date ("Invoice-20261418" is an invoice number, not 18/14/2026).
  let dm = base.match(/(20\d\d)[-_. ]?(0[1-9]|1[0-2])[-_. ]?(0[1-9]|[12]\d|3[01])(?!\d)/);
  if (dm && isNaN(Date.parse(`${dm[1]}-${dm[2]}-${dm[3]}T12:00:00Z`))) dm = null;
  const date = dm ? `${dm[1]}-${dm[2]}-${dm[3]}` : (file.createdTime ? new Date(Date.parse(file.createdTime) + 3 * 3600e3).toISOString().slice(0, 10) : today());
  const low = base.toLowerCase(), rule = S.rules.find((r) => r.match && low.includes(String(r.match).toLowerCase()));
  let what = base.replace(dm ? dm[0] : "", "").replace(/[_]+/g, " ");
  if (rule) what = what.replace(new RegExp(rule.match.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), "");
  what = what.replace(/^[\s\-–·]+|[\s\-–·]+$/g, "").replace(/\s{2,}/g, " ");

  if (m) return { date: m[1], who: m[2], what: m[3], ext, folderId: rule ? rule.folderId : "" };

const houseName = (s) => `${s.date} ${s.who.trim()} - ${s.what.trim()}${s.ext}`.replace(/\s+/g, " ").replace(/[\/\\:*?"<>|]/g, "-");

// ======================================================================= onboarding logic (same as the tracker)
const PH = O.phases, ST = O.steps;
const ost = (r, s) => (r.steps && r.steps[s.id]) || {};
const applies = (r, s) => !(s.needs === "printing" && r.printing === "no");
