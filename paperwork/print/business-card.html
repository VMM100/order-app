<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business card · Wasabi</title>
<link rel="stylesheet" href="../lib/print.css">
<style>
  .front .lockup{position:absolute;left:8mm;top:9mm;height:7.4mm}
  .front .big-leaf{position:absolute;right:-17mm;bottom:-20mm;width:62mm;height:62mm;opacity:.95}
  .front .line{position:absolute;left:8mm;bottom:9.5mm;font:600 8.2pt/1.35 var(--body);color:#dfe5d3;max-width:42mm}
  .back .safe{display:flex;flex-direction:column;justify-content:space-between;left:8mm;right:8mm;top:8.5mm;bottom:8.5mm}
  .back .name{font:800 14pt/1 var(--display);color:var(--ink);letter-spacing:-.01em}
  .back .role{display:inline-block;margin-top:2mm;font:600 6.6pt var(--body);letter-spacing:.14em;text-transform:uppercase}
  .back .rows{display:grid;gap:1.1mm;font-size:7.6pt;color:var(--text)}
  .back .rows span{display:flex;align-items:center;gap:2mm}
  .back .rows svg{width:2.8mm;height:2.8mm;flex:none;stroke:var(--wasabi-deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .back .mini{position:absolute;right:8mm;top:8.5mm;width:7mm;height:7mm}
  .back .strip{position:absolute;left:0;right:0;bottom:0;height:5mm;background:var(--wasabi)}
</style>
</head>
<body data-trim="85x55">
<!-- 85 × 55 mm. Office: 10 on an A4 sheet with crop marks; print shop: each side with 3 mm bleed. -->
<section class="face ink front">
  <img class="lockup" src="../../img/brand/wasabi-lockup-reverse.svg" alt="Wasabi">
  <svg class="big-leaf" viewBox="0 0 64 64" aria-hidden="true"><path class="leaf" fill-rule="evenodd" d="M31.0 33.0L21.4 52.7A26 26 0 1 0 11.3 42.6ZM31.3 28.7L25.2 13.9L28.4 29.6ZM34.9 31.2L45.1 18.9L32.8 29.1ZM34.4 35.6L50.1 38.8L35.3 32.7Z"/><path class="leaf" d="M29.7 31.7L32.3 34.3L9.3 60.1a2.1 2.1 0 0 1-3-3Z"/></svg>
  <div class="line">Order at the table.<br>The bill splits itself.</div>
</section>
<section class="face paper back" data-back>
  <div class="safe">
    <div><div class="name" data-k="signatory"></div><span class="role pink" data-k="cardTitle"></span></div>
    <div class="rows">
      <span><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span data-k="phoneIntl"></span></span>
      <span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span data-k="personalEmail"></span></span>
      <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-k="web"></span></span>
      <span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h0"/></svg><span data-k="instagram"></span></span>
    </div>
  </div>
  <img class="mini" src="../../img/brand/favicon.svg" alt="">
  <div class="strip"></div>
</section>
<script src="../lib/fill.js"></script>
<script src="../lib/print.js"></script>
</body>
</html>
