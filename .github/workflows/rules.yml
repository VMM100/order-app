name: Security rules tests
on:
  push:
    paths: ["firestore.rules", "tests/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --no-audit --no-fund firebase-tools@15 @firebase/rules-unit-testing@6 firebase@13
      - run: ./run.sh
