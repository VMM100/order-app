# Check and publish Wasabi.
#
#   staging branch  →  checks  →  staging site (https://wasabi-tz-staging.web.app)
#   main branch     →  checks  →  database rules → live site (https://wasabi.co.tz) → version tag live-…
#   Both also publish the ring service (worker/ring.js) to Cloudflare: wasabi-ring-staging / wasabi-ring.
#   Run workflow    →  pick a version tag (e.g. live-2026-10-24-0930) to put an older version back live.
#
# Nothing is published unless every check passes: scripts parse, the main pages open in a real
# browser without errors, and the database security tests pass.
name: Check and publish
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Roll back: version tag to put live (e.g. live-2026-10-24-0930). Leave empty to republish the latest main."
        required: false

# Read-only by default (the checks, including those run for pull requests). Only "Publish live" gets
# write access: to push the version tag and publish GitHub Pages.
permissions:
  contents: read

env:
  REF: ${{ inputs.version || github.sha }}
  PROJECT: order-app-47367

jobs:
  pages:
    name: Pages open without errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.REF }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - name: Install the exact tools (package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Every script parses
        run: node tests/syntax.mjs
      - name: Install a headless browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Open the main pages
        run: node tests/smoke.mjs

  rules:
    name: Database security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.REF }}" }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - name: Install the exact tools (package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: { distribution: temurin, java-version: 21 }
      - run: ./tests/run.sh

  staging:
    name: Publish to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [pages, rules]
    runs-on: ubuntu-latest
    concurrency: { group: staging, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - name: Install the exact tools (package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish the ring service (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          RINGER: "${{ secrets.RINGER_SERVICE_ACCOUNT }}"
        run: |
          if [ ! -f worker/ring.js ]; then echo "No ring service in this version."; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$RINGER" ]; then
            echo "::warning title=Ring service not published::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and RINGER_SERVICE_ACCOUNT in GitHub secrets to turn on waiter ringing."; exit 0; fi
          cd worker && npx --no-install wrangler deploy --name wasabi-ring-staging 2>&1 | tee deploy.txt
          printf '%s' "$RINGER" | npx --no-install wrangler secret put GOOGLE_SERVICE_ACCOUNT --name wasabi-ring-staging
          url=$(grep -oE 'https://wasabi-ring-staging\.[a-z0-9-]+\.workers\.dev' deploy.txt | head -1)
          echo "### Ring service → $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign in to Firebase
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          if [ -z "$SA" ]; then echo "::error title=Staging not set up yet::Add the FIREBASE_SERVICE_ACCOUNT secret in GitHub (Settings → Secrets and variables → Actions)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"; echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      # Staging shares the live database, so its rules go out here too. Rules changes must stay backward
      # compatible (only add what's new), so the live site keeps working with them.
      - name: Publish database rules
        run: npx --no-install firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive
      - name: Build the site folder
        run: rsync -a --exclude .git --exclude .github --exclude tests --exclude node_modules --exclude docs --exclude SECURITY.md --exclude CLAUDE.md --exclude package.json --exclude package-lock.json --exclude firebase.json --exclude .firebaserc --exclude worker ./ _site/ && echo "${GITHUB_SHA::12}" > _site/version.txt && cp _site/version.txt _site/demo/version.txt
      - name: Make the staging site (first time only)
        run: npx --no-install firebase hosting:sites:create wasabi-tz-staging --project "$PROJECT" --non-interactive || true
      - name: Publish
        run: npx --no-install firebase deploy --only hosting:staging --project "$PROJECT" --non-interactive --message "${GITHUB_SHA::7}"
      - run: echo "### Staging updated → https://wasabi-tz-staging.web.app" >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Publish live
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [pages, rules]
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    concurrency: { group: live, cancel-in-progress: false }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.REF }}", fetch-depth: 1 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - name: Install the exact tools (package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Rules go first, so the live app never runs against rules older than it expects. Rules changes are
      # kept backward compatible, so the app still live meanwhile keeps working. Rollbacks leave rules alone.
      - name: Publish database rules
        if: github.event_name == 'push'
        env: { SA: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: |
          # Published every release (Firebase skips it if nothing changed), so rules never fall behind.
          if [ -z "$SA" ]; then echo "::warning title=Rules not published automatically::Add the FIREBASE_SERVICE_ACCOUNT secret, or paste firestore.rules into Firebase → Firestore → Rules and Publish."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --no-install firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive
      - name: Publish the ring service (Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          RINGER: "${{ secrets.RINGER_SERVICE_ACCOUNT }}"
        run: |
          if [ ! -f worker/ring.js ]; then echo "No ring service in this version."; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$RINGER" ]; then
            echo "::warning title=Ring service not published::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and RINGER_SERVICE_ACCOUNT in GitHub secrets to turn on waiter ringing."; exit 0; fi
          cd worker && npx --no-install wrangler deploy --name wasabi-ring 2>&1 | tee deploy.txt
          printf '%s' "$RINGER" | npx --no-install wrangler secret put GOOGLE_SERVICE_ACCOUNT --name wasabi-ring
          url=$(grep -oE 'https://wasabi-ring\.[a-z0-9-]+\.workers\.dev' deploy.txt | head -1)
          echo "### Ring service → $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the site folder
        run: rsync -a --exclude .git --exclude .github --exclude tests --exclude node_modules --exclude docs --exclude SECURITY.md --exclude CLAUDE.md --exclude package.json --exclude package-lock.json --exclude firebase.json --exclude .firebaserc --exclude worker ./ _site/ && echo "${GITHUB_SHA::12}" > _site/version.txt && cp _site/version.txt _site/demo/version.txt
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Tag this version
        if: github.event_name == 'push'
        run: |
          tag="live-$(TZ=Africa/Dar_es_Salaam date +%Y-%m-%d-%H%M)"
          git tag "$tag" && git push origin "$tag"
          echo "### Live → https://wasabi.co.tz (version $tag)" >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'workflow_dispatch'
        # The typed version goes in through an environment variable, never pasted into the command itself.
        env: { WANT: "${{ inputs.version || 'latest main' }}" }
        run: echo "### Live → https://wasabi.co.tz (put back to $WANT)" >> "$GITHUB_STEP_SUMMARY"
